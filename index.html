<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 GitHub 练习</title>

    ·  
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>我的第一个 GitHub 分支测试</h1>

    <p>今天开始正式学习 Git 和 GitHub。</p>

    <p id="count">点击次数：0</p>

    <button onclick="addCount()">点我</button>

    <script>
        let count = 0;

        function addCount() {
            count++;

            document.getElementById("count").innerText =
                "点击次数：" + count;
        }
    </script>

</body>
</html>
